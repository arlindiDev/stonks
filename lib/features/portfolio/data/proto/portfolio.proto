syntax = "proto3";

package portfolio;

// Portfolio Service Definition
service PortfolioService {
  // - Chart with ALL periods (1D, 1W, 1M, 6M, YTD, 1Y, ALL)
  // - All portfolio items
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse);
}

// Request/Response Messages

message GetPortfolioRequest {
  // Optional filters can be added here
  string user_id = 1;
}

message GetPortfolioResponse {
  PortfolioChart chart = 1;  // Chart contains all periods
  repeated PortfolioItem items = 2;
}

// Data Models

message PortfolioChart {
  // Map of period name to chart data (e.g., "1D", "1W", "1M", "6M", "YTD", "1Y", "ALL")
  map<string, ChartPeriodData> periods = 1;
}

message ChartPeriodData {
  repeated ChartDataPoint data_points = 1;
  double latest_price = 2;
  double unrealized_pl = 3;
  double unrealized_pl_percent = 4;
  double min_value = 5;
  double max_value = 6;
}

message ChartDataPoint {
  double value = 1;
  int64 timestamp_millis = 2;  // Unix timestamp in milliseconds
  double percent_change = 3;
}

message PortfolioItem {
  string ticker = 1;
  double position = 2;
  double avg_price = 3;
  double current_price = 4;
  double market_value = 5;
  double portfolio_percent = 6;
  double unrealized_pl = 7;
  double unrealized_pl_percent = 8;
}
